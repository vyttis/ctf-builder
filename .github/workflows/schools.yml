name: Schools registry

# Refreshes lib/data/schools.json (the school picker in onboarding and
# access requests). Runs on demand and monthly; the file is uploaded as an
# artifact and committed by a maintainer after review.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  pull_request:
    paths: ["scripts/update-schools.py", ".github/workflows/schools.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Download the warehouse
        run: curl -fsSL -A "kusteam-classroom-schools/1.0 (+https://pamokos.kusteam.app)" -o warehouse.db https://pub-b9a214779ee84455a693b9741bebb3b4.r2.dev/duckdb/mcp_warehouse.db
      - run: python scripts/update-schools.py warehouse.db schools.json
      - uses: actions/upload-artifact@v4
        with:
          name: schools-json
          path: schools.json
          retention-days: 30
