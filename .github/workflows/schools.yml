name: Schools registry

# Refreshes lib/data/schools.json (the school picker in onboarding and
# access requests) from the open ŠVIS data. On a PR that changes the
# script it commits the result to that PR; on demand or monthly it opens
# a refresh PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  pull_request:
    paths: ["scripts/update-schools.py", ".github/workflows/schools.yml"]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Download the warehouse
        run: curl -fsSL -A "kusteam-classroom-schools/1.0 (+https://pamokos.kusteam.app)" -o "$RUNNER_TEMP/warehouse.db" https://pub-b9a214779ee84455a693b9741bebb3b4.r2.dev/duckdb/mcp_warehouse.db
      - run: python scripts/update-schools.py "$RUNNER_TEMP/warehouse.db" lib/data/schools.json
      - name: Commit the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/schools.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git commit -m "Update the school registry file"
            git push
          else
            git switch -c "schools-refresh-$(date +%Y%m%d)"
            git commit -m "Update the school registry file"
            git push -u origin HEAD
            gh pr create --fill --base main
          fi
