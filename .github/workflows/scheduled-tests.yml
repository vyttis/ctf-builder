name: Scheduled tests

# Full automated check every 72 hours (and on demand via workflow_dispatch):
# unit tests + typecheck + lint + production build. Catches drift that
# per-PR CI can't — dependency changes, environment rot, flaky behavior.
on:
  schedule:
    - cron: "17 3 */3 * *" # every 3 days at 03:17 UTC
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
